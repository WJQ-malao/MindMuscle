server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 知识库上传限制 20MB，留出余量
    client_max_body_size 25m;

    # Vue Router history 模式：前端路由回退到 index.html
    # index.html 禁止缓存：每次部署后客户端必须重新拉取入口，才能拿到新 JS/CSS 的哈希文件名
    # （JS/CSS 带内容哈希，可长缓存；入口文件不缓存是前端发版的标准做法）
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的静态资源：长缓存（文件名变即内容变，不怕旧缓存）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 后端 API（容器网络内通过服务名 backend 访问）
    location /api/ {
        proxy_pass http://backend:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式对话（/api/chat/stream）：关闭缓冲与缓存，否则流式输出会被攒到最后
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
    }
}
