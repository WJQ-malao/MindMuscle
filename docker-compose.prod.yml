# 生产环境一键部署（云服务器，Linux + Docker）
#
# 与开发环境的区别：
#   - MySQL 改为容器，首次启动自动执行 发版/ 下全部 SQL 脚本
#   - 向量库用 Qdrant 单容器（默认），替代原 Milvus + etcd + MinIO 三件套，
#     2核4G 服务器即可跑全套（原方案需 4核8G）
#   - 新增 backend 与 frontend(Nginx) 两个服务，对外只暴露 80 端口
#   - 如需切回 Milvus：backend 环境加 VECTOR_STORE_TYPE=milvus，
#     并把本文件中的 qdrant 服务换回 Milvus 三件套编排（git 历史可找回）
#
# 使用方法：
#   1. 服务器安装 Docker 与 docker compose 插件
#   2. 在本文件底部 environment 处填入真实密钥（或改用 .env 文件，见 README）
#   3. docker compose -f docker-compose.prod.yml up -d --build
#   4. 浏览器访问 http://服务器公网IP ，注册账号即可使用
#
# 硬件要求：2核4G 起（全套约占用 2G 内存）；4G 以下不适用

services:
  mysql:
    image: mysql:8.4
    container_name: fitness-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 或环境中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    # 仅容器网络内部访问，不映射到宿主机，减小暴露面（调试时可临时打开）
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化按文件名顺序执行（时间戳前缀天然有序）
      - ./发版/2026-11-17/20261117000001_init_fitness_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./发版/2026-11-17/20261117180001_rbac_upgrade.sql:/docker-entrypoint-initdb.d/02_rbac.sql:ro
      - ./发版/2026-11-18/20261118000001_knowledge_file_path.sql:/docker-entrypoint-initdb.d/03_knowledge.sql:ro
      - ./发版/2026-11-18/20261118000002_exercise_lib.sql:/docker-entrypoint-initdb.d/04_exercise.sql:ro
      - ./发版/2026-11-18/20261118000003_exercise_lib_enrich.sql:/docker-entrypoint-initdb.d/05_exercise_enrich.sql:ro
      - ./发版/2026-11-18/20261118000004_workout_item_weight.sql:/docker-entrypoint-initdb.d/06_item_weight.sql:ro
      - ./发版/2026-11-18/20261118000005_checkin_per_set.sql:/docker-entrypoint-initdb.d/07_checkin_setno.sql:ro
      - ./发版/2026-11-18/20261118000006_exercise_image_url.sql:/docker-entrypoint-initdb.d/08_exercise_image_url.sql:ro
      - ./发版/2026-11-19/20261119000001_exercise_manage_perm.sql:/docker-entrypoint-initdb.d/09_exercise_perm.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    # 版本与 Spring AI 1.0 内置的 qdrant-java-client 1.13.x 对齐，避免启动版本告警
    image: qdrant/qdrant:v1.13.6
    container_name: fitness-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant 镜像无 curl/wget，改用 bash 内建 /dev/tcp 做端口探活
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: fitness-backend
    environment:
      # 数据库 / 向量库走容器网络内的服务名
      MYSQL_HOST: mysql
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 或环境中设置 MYSQL_PASSWORD}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      # ===== 以下为机密项，必须用真实值替换（建议写入服务器上的 .env 文件） =====
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请设置 DEEPSEEK_API_KEY}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?请设置 SILICONFLOW_API_KEY}
      # 任意足够长的随机字符串，如: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
    volumes:
      # 知识库原始文件持久化（容器重建后不丢）
      - knowledge_data:/app/knowledge-files
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: fitness-frontend
    ports:
      # 对外入口：http://域名:8000 或 http://服务器IP:8000
      # 用 8000 非常用端口规避大陆 80/443 的备案检测（试用ECS无法备案接入）
      - "8000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
  knowledge_data:
