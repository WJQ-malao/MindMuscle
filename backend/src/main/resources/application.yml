server:
  port: 8082

spring:
  application:
    name: fitness-ai-backend
  ai:
    openai:
      # 对话：DeepSeek 官方 OpenAI 兼容接口
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${CHAT_MODEL:deepseek-chat}
          temperature: 0.7
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
        database-name: default
        collection-name: fitness_knowledge
        embedding-dimension: 1024
        index-type: IVF_FLAT
        metric-type: COSINE
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/fitness_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

app:
  # Embedding 走硅基流动（DeepSeek 官方无 Embedding 模型），由 EmbeddingConfig 手动构建
  siliconflow:
    api-key: ${SILICONFLOW_API_KEY:}
  jwt:
    # 仅开发用，生产环境用环境变量覆盖
    secret: ${JWT_SECRET:fitness-ai-dev-secret-key-please-change-in-prod-0123456789}
    expire-hours: 72
