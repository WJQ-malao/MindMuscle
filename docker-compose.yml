# Qdrant 向量库一键启动（单容器，默认向量库）
# 说明：向量库已从 Milvus(etcd+Milvus+MinIO 三件套) 切换为 Qdrant 单容器，
# 内存占用从 ~3G 降到 <1G，部署与排障都更简单。
# 如需切回 Milvus（如答辩演示原版架构），见 backend/application-milvus.yml。
# 一条命令启动: docker compose up -d

services:
  qdrant:
    # 版本与 Spring AI 1.0 内置的 qdrant-java-client 1.13.x 对齐，避免启动版本告警
    image: qdrant/qdrant:v1.13.6
    container_name: fitness-qdrant
    ports:
      # gRPC：后端 Spring AI 客户端使用
      - "6334:6334"
      # REST + Web Dashboard：浏览器访问 http://localhost:6333/dashboard
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant 镜像无 curl/wget，改用 bash 内建 /dev/tcp 做端口探活
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # 本机已有 MySQL 8（端口 3306 被占用），数据库由本机承载：
  # 手动执行 发版/ 下各日期目录的 SQL 脚本（按时间戳顺序）即可。
  # 如需改用容器 MySQL（比如换台干净机器），取消下面注释并把端口改为 "3307:3306" 避免冲突。
  # mysql:
  #   image: mysql:8.4
  #   container_name: fitness-mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root123456
  #     TZ: Asia/Shanghai
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #     - ./发版/2026-11-17/20261117000001_init_fitness_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
  #   command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123456"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

volumes:
  qdrant_data:
  mysql_data:
