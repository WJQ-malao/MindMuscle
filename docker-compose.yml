version: '3.8'

# Milvus 独立部署（etcd 容器 + Milvus 容器 + 宿主机 MinIO 进程）
# 说明：各 Docker 镜像站均无 minio 容器镜像（官方已下架 Docker Hub），
# 因此 MinIO 以 Windows 原生进程运行（minio.exe server），数据目录在宿主机，
# Milvus 容器通过 host.docker.internal:9000 访问。
# MinIO 启动命令见 README。一条命令启动: docker compose up -d

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: fitness-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.6
    container_name: fitness-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # MinIO 以 Windows 原生进程运行在宿主机(镜像站均无 minio 容器镜像)，
      # host.docker.internal 为容器访问宿主机的专用域名
      MINIO_ADDRESS: host.docker.internal:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy

  # 本机已有 MySQL 8（端口 3306 被占用），数据库由本机承载：
  # 手动执行 发版/2026-11-17/20261117000001_init_fitness_db.sql 即可。
  # 如需改用容器 MySQL（比如换台干净机器），取消下面注释并把端口改为 "3307:3306" 避免冲突。
  # mysql:
  #   image: mysql:8.4
  #   container_name: fitness-mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root123456
  #     TZ: Asia/Shanghai
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #     - ./发版/2026-11-17/20261117000001_init_fitness_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
  #   command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123456"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

volumes:
  etcd_data:
  milvus_data:
  mysql_data:
